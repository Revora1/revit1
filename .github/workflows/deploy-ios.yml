name: Build & Deploy iOS App to App Store

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  deploy-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Assets
        run: |
          npm run build

      - name: Sync Capacitor iOS Platform
        run: |
          npx cap sync ios

      - name: Install Apple Certificate, Provisioning Profile & Build iOS App
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          BUILD_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary-keychain-password-123"
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Decode secrets to files
          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r \n' | base64 --decode -o "$CERTIFICATE_PATH"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r \n' | base64 --decode -o "$PP_PATH"

          # Detect openssl 3 (Homebrew) or fallback to system openssl
          OPENSSL_CMD="openssl"
          if [ -f "/opt/homebrew/opt/openssl@3/bin/openssl" ]; then
            OPENSSL_CMD="/opt/homebrew/opt/openssl@3/bin/openssl"
          elif [ -f "/usr/local/opt/openssl@3/bin/openssl" ]; then
            OPENSSL_CMD="/usr/local/opt/openssl@3/bin/openssl"
          fi
          echo "Using openssl binary: $OPENSSL_CMD"

          # Quick check: ensure the p12 can be read with the provided password
          if ! "$OPENSSL_CMD" pkcs12 -in "$CERTIFICATE_PATH" -nokeys -passin pass:"$BUILD_CERT_PASSWORD" -noout >/dev/null 2>&1; then
            echo "ERROR: Unable to read p12 with provided password using $OPENSSL_CMD."
            echo "Please check if IOS_DISTRIBUTION_CERTIFICATE_BASE64 is valid and IOS_DISTRIBUTION_CERT_PASSWORD matches."
            exit 1
          fi

          # Convert certificate to macOS-compatible legacy format if needed
          # (only if openssl supports legacy provider - OpenSSL 3)
          if "$OPENSSL_CMD" version | grep -q "OpenSSL 3"; then
            echo "Converting PKCS12 to compatible legacy format (TripleDES/SHA1)..."
            "$OPENSSL_CMD" pkcs12 -in "$CERTIFICATE_PATH" -nodes -passin pass:"$BUILD_CERT_PASSWORD" -out "$RUNNER_TEMP/temp.pem"
            "$OPENSSL_CMD" pkcs12 -export -legacy -provider legacy -provider default -in "$RUNNER_TEMP/temp.pem" -out "$CERTIFICATE_PATH" -passout pass:"$BUILD_CERT_PASSWORD"
            rm "$RUNNER_TEMP/temp.pem"
          fi

          # Create and configure a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate into the temporary keychain
          security import "$CERTIFICATE_PATH" -P "$BUILD_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security

          # Ensure the temporary keychain is in the search list (important for xcodebuild search path)
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Allow codesign to access the key without visual prompts
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          # Use xcodebuild to archive the app with manual code signing
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     archive \
                     DEVELOPMENT_TEAM="ZLHX8SG89D" \
                     CODE_SIGN_STYLE="Manual" \
                     PROVISIONING_PROFILE_SPECIFIER="RevitUp App Store Profile" \
                     CODE_SIGN_IDENTITY="iPhone Distribution"

          # Export the IPA file from archive
          # We generate a simple exportOptions.plist on the fly
          cat <<EOF > $RUNNER_TEMP/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>ZLHX8SG89D</string>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>today.revitup.app</key>
                  <string>RevitUp App Store Profile</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
                     -exportPath $RUNNER_TEMP/exported

      - name: Upload IPA to App Store Connect / TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # Create folder for Apple's private key and write it
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8

          # Upload built .ipa file to Apple
          xcrun altool --upload-app \
                       --type ios \
                       --file $RUNNER_TEMP/exported/App.ipa \
                       --apiKey "$API_KEY_ID" \
                       --apiIssuer "$API_ISSUER_ID"
