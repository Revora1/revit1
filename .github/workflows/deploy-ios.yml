name: Build & Deploy iOS App to App Store

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  deploy-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm ci || npm install

      - name: Auto-increment version
        run: |
          node scripts/increment-build-numbers.js

      - name: Build Web Assets
        run: |
          npm run build

      - name: Sync Capacitor iOS Platform
        run: |
          npx cap sync ios

      - name: Recreate iOS Assets
        run: |
          echo "Cleaning up corrupted or outdated iOS assets..."
          rm -rf ios/App/App/Assets.xcassets/AppIcon.appiconset
          rm -rf ios/App/App/Assets.xcassets/Splash.imageset
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p ios/App/App/Assets.xcassets/Splash.imageset
          cat << 'EOF' > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images": [
              {
                "idiom": "iphone",
                "size": "20x20",
                "scale": "2x",
                "filename": "AppIcon-20x20@2x.png"
              },
              {
                "idiom": "iphone",
                "size": "20x20",
                "scale": "3x",
                "filename": "AppIcon-20x20@3x.png"
              },
              {
                "idiom": "iphone",
                "size": "29x29",
                "scale": "2x",
                "filename": "AppIcon-29x29@2x.png"
              },
              {
                "idiom": "iphone",
                "size": "29x29",
                "scale": "3x",
                "filename": "AppIcon-29x29@3x.png"
              },
              {
                "idiom": "iphone",
                "size": "40x40",
                "scale": "2x",
                "filename": "AppIcon-40x40@2x.png"
              },
              {
                "idiom": "iphone",
                "size": "40x40",
                "scale": "3x",
                "filename": "AppIcon-40x40@3x.png"
              },
              {
                "idiom": "iphone",
                "size": "60x60",
                "scale": "2x",
                "filename": "AppIcon-60x60@2x.png"
              },
              {
                "idiom": "iphone",
                "size": "60x60",
                "scale": "3x",
                "filename": "AppIcon-60x60@3x.png"
              },
              {
                "idiom": "ipad",
                "size": "20x20",
                "scale": "1x",
                "filename": "AppIcon-20x20~ipad.png"
              },
              {
                "idiom": "ipad",
                "size": "20x20",
                "scale": "2x",
                "filename": "AppIcon-20x20@2x~ipad.png"
              },
              {
                "idiom": "ipad",
                "size": "29x29",
                "scale": "1x",
                "filename": "AppIcon-29x29~ipad.png"
              },
              {
                "idiom": "ipad",
                "size": "29x29",
                "scale": "2x",
                "filename": "AppIcon-29x29@2x~ipad.png"
              },
              {
                "idiom": "ipad",
                "size": "40x40",
                "scale": "1x",
                "filename": "AppIcon-40x40~ipad.png"
              },
              {
                "idiom": "ipad",
                "size": "40x40",
                "scale": "2x",
                "filename": "AppIcon-40x40@2x~ipad.png"
              },
              {
                "idiom": "ipad",
                "size": "76x76",
                "scale": "1x",
                "filename": "AppIcon-76x76~ipad.png"
              },
              {
                "idiom": "ipad",
                "size": "76x76",
                "scale": "2x",
                "filename": "AppIcon-76x76@2x~ipad.png"
              },
              {
                "idiom": "ipad",
                "size": "83.5x83.5",
                "scale": "2x",
                "filename": "AppIcon-83.5x83.5@2x~ipad.png"
              },
              {
                "idiom": "ios-marketing",
                "size": "1024x1024",
                "scale": "1x",
                "filename": "AppIcon-512@2x.png"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF
          cat << 'EOF' > ios/App/App/Assets.xcassets/Splash.imageset/Contents.json
          {
            "images": [
              { "idiom": "universal", "scale": "1x", "filename": "Default@1x~universal~anyany.png" },
              { "idiom": "universal", "scale": "2x", "filename": "Default@2x~universal~anyany.png" },
              { "idiom": "universal", "scale": "3x", "filename": "Default@3x~universal~anyany.png" },
              { "appearances": [{ "appearance": "luminosity", "value": "dark" }], "idiom": "universal", "scale": "1x", "filename": "Default@1x~universal~anyany-dark.png" },
              { "appearances": [{ "appearance": "luminosity", "value": "dark" }], "idiom": "universal", "scale": "2x", "filename": "Default@2x~universal~anyany-dark.png" },
              { "appearances": [{ "appearance": "luminosity", "value": "dark" }], "idiom": "universal", "scale": "3x", "filename": "Default@3x~universal~anyany-dark.png" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          EOF
          npm i -D @capacitor/assets
          npx @capacitor/assets generate --ios

      - name: Install Apple Certificate, Provisioning Profile & Build iOS App
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          BUILD_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary-keychain-password-123"
        run: |
          set -e

          echo "========================================"
          echo "Decoding Certificates and Profiles..."
          echo "========================================"
          
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Decode secrets to files
          if echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r \n' | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null; then
            echo "Decoded certificate using base64 --decode"
          elif echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\r \n' | base64 -D > "$CERTIFICATE_PATH" 2>/dev/null; then
            echo "Decoded certificate using base64 -D"
          else
            echo "::error::Failed to base64 decode the certificate. Check IOS_DISTRIBUTION_CERTIFICATE_BASE64 secret."
            exit 1
          fi
          
          if echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r \n' | base64 --decode > "$PP_PATH" 2>/dev/null; then
            echo "Decoded provisioning profile using base64 --decode"
          elif echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r \n' | base64 -D > "$PP_PATH" 2>/dev/null; then
            echo "Decoded provisioning profile using base64 -D"
          else
            echo "::error::Failed to base64 decode the provisioning profile. Check IOS_PROVISIONING_PROFILE_BASE64 secret."
            exit 1
          fi

          echo "========================================"
          echo "Verifying Certificate Password..."
          echo "========================================"

          # Detect openssl 3 (Homebrew) or fallback to system openssl
          OPENSSL_CMD="openssl"
          if [ -f "/opt/homebrew/opt/openssl@3/bin/openssl" ]; then
            OPENSSL_CMD="/opt/homebrew/opt/openssl@3/bin/openssl"
          elif [ -f "/usr/local/opt/openssl@3/bin/openssl" ]; then
            OPENSSL_CMD="/usr/local/opt/openssl@3/bin/openssl"
          fi

          # Quick check: ensure the p12 can be read with the provided password
          if ! "$OPENSSL_CMD" pkcs12 -info -in "$CERTIFICATE_PATH" -noout -passin pass:"$BUILD_CERT_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The password provided in IOS_DISTRIBUTION_CERT_PASSWORD is WRONG, or the certificate is corrupted."
            echo "::error::Please verify that IOS_DISTRIBUTION_CERT_PASSWORD exactly matches the password used to export the .p12 file."
            exit 1
          fi
          
          echo "Password is correct."

          # Convert certificate to macOS-compatible legacy format if needed
          if "$OPENSSL_CMD" version | grep -q "OpenSSL 3"; then
            echo "Converting PKCS12 to compatible legacy format (TripleDES/SHA1) for macOS Keychain..."
            "$OPENSSL_CMD" pkcs12 -in "$CERTIFICATE_PATH" -nodes -passin pass:"$BUILD_CERT_PASSWORD" -out "$RUNNER_TEMP/temp.pem"
            "$OPENSSL_CMD" pkcs12 -export -legacy -provider legacy -provider default -in "$RUNNER_TEMP/temp.pem" -out "$CERTIFICATE_PATH" -passout pass:"$BUILD_CERT_PASSWORD"
            rm "$RUNNER_TEMP/temp.pem"
          fi

          echo "========================================"
          echo "Setting up macOS Keychain..."
          echo "========================================"

          # Create and configure a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate into the temporary keychain
          security import "$CERTIFICATE_PATH" -P "$BUILD_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          
          # Ensure the temporary keychain is in the search list (important for xcodebuild search path)
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          # Allow codesign to access the key without visual prompts
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "========================================"
          echo "Building and Archiving iOS App..."
          echo "========================================"

          # Use xcodebuild to archive the app with manual code signing
          if ! xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     archive \
                     DEVELOPMENT_TEAM="ZLHX8SG89D" \
                     CODE_SIGN_STYLE="Manual" \
                     PROVISIONING_PROFILE_SPECIFIER="RevitUp App Store Profile" \
                     CODE_SIGN_IDENTITY="iPhone Distribution" \
                     OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"; then
            echo "::error::xcodebuild archive failed. See logs above for details."
            exit 1
          fi

          echo "========================================"
          echo "Exporting IPA..."
          echo "========================================"

          # Export the IPA file from archive
          cat <<'PLIST_EOF' > $RUNNER_TEMP/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>ZLHX8SG89D</string>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>today.revitup.app</key>
                  <string>RevitUp App Store Profile</string>
              </dict>
          </dict>
          </plist>
          PLIST_EOF
          
          if ! xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/App.xcarchive \
                     -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
                     -exportPath $RUNNER_TEMP/exported; then
            echo "::error::xcodebuild exportArchive failed. See logs above for details."
            exit 1
          fi

      - name: Decode API Key for App Store Connect
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          CLEANED_BASE64=$(echo -n "$API_KEY_BASE64" | tr -d '\r \n')
          if echo "$CLEANED_BASE64" | base64 --decode > "$RUNNER_TEMP/api_key.p8" 2>/dev/null; then
            echo "Decoded key using base64 --decode"
          elif echo "$CLEANED_BASE64" | base64 -D > "$RUNNER_TEMP/api_key.p8" 2>/dev/null; then
            echo "Decoded key using base64 -D"
          else
            echo "::error::Failed to base64 decode App Store Connect API Key"
            exit 1
          fi
          
          echo "APP_STORE_CONNECT_API_KEY<<EOF" >> $GITHUB_ENV
          cat "$RUNNER_TEMP/api_key.p8" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Upload IPA to App Store Connect / TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/exported/App.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ env.APP_STORE_CONNECT_API_KEY }}
